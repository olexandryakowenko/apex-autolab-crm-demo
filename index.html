function acctPost(doc,description,debit,credit,amount,location='boyarka',status='Проведено'){if(!(amount>0)||debit===credit){toast('Перевір суму та рахунки операції.');return false}acctInit();let e={id:'JE-'+Date.now().toString().slice(-9),doc,description,debit,credit,amount:Number(amount),date:new Date().toLocaleString('sv-SE').replace('T',' ').slice(0,16),status,location,source:'Створено в демопрототипі',reversed:false};for(let c of [debit,credit]){let a=S.acct.accounts.find(x=>x[0]===c);if(a){let normal=['Актив','Витрати'].includes(a[3])?'debit':'credit';a[2]=Number(a[2]||0)+(c===debit?(normal==='debit'?amount:-amount):(normal==='credit'?amount:-amount))}}S.acct.entries.unshift(e);let shift=cashShiftFor(location),code=cashCode(location);if(shift&&(debit===code||credit===code)){let delta=(debit===code?1:-1)*Number(amount);shift.movements=shift.movements||[];shift.movements.unshift({entryId:e.id,doc,description,delta,at:e.date,reference:e.reference||''});e.cashShiftId=shift.id}let typ=document.getElementById('aeType')?.value;if(typ==='invoice')S.acct.ar.unshift([doc,description.replace(/^Рахунок клієнту:?/,'Клієнт: '),'Замовлення / послуги',Number(amount),document.getElementById('aeDue')?.value||new Date().toISOString().slice(0,10),'До сплати']);if(typ==='supplier')S.acct.ap.unshift([doc,description,Number(amount),new Date(Date.now()+7*86400000).toISOString().slice(0,10),'До сплати']);if(typ==='income'||typ==='supplierpay'){let rows=typ==='income'?S.acct.ar:S.acct.ap,idx=rows.findIndex(r=>description.includes(r[0]));if(idx>=0){rows[idx][typ==='income'?3:2]=Math.max(0,Number(rows[idx][typ==='income'?3:2])-Number(amount));rows[idx][typ==='income'?5:4]=rows[idx][typ==='income'?3:2]?'Частково сплачено':'Сплачено'}}save();return true}

function acctDownload(name,csv){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function acctImportBank(file){let fr=new FileReader();fr.onload=()=>{let lines=String(fr.result||'').split(/\r?\n/).filter(Boolean),added=0;lines.slice(1).forEach((line,i)=>{let c=line.split(/[;,\t]/).map(x=>x.replace(/^"|"$/g,'').trim());if(c.length<3)return;let amt=Number(c.find(x=>/^-?\d+[.,]?\d*$/.test(x.replace(/[₴\s]/g,'')))?.replace(/[₴\s]/g,'').replace(',','.'));if(!Number.isFinite(amt)||amt===0)return;let date=c.find(x=>/^\d{4}-\d{2}-\d{2}/.test(x))||'2026-10-02',desc=c.find(x=>x!==date&&!/^-?\d+[.,]?\d*$/.test(x.replace(/[₴\s]/g,'')))||`Операція ${i+1}`;S.acct.bankRows.unshift([date,desc,(amt>0?'+':'')+'₴'+Math.abs(amt).toLocaleString('uk-UA'),'Нерознесено']);added++});save();render('finance');toast(`Імпортовано ${added} рядків виписки. Перевір їх перед проведенням.`)};fr.readAsText(file,'utf-8')}

function modal(title,body,foot='',wide=false){document.getElementById('mtitle').textContent=title;document.getElementById('mbody').innerHTML=body;document.getElementById('mfoot').innerHTML=foot||'<button class="btn" data-close>Закрити</button>';document.getElementById('modalbox').classList.toggle('wide',wide);document.getElementById('modal').classList.add('open')};function close(){document.getElementById('modal').classList.remove('open')}function photoInput(id='photos'){return `<label class="btn small">＋ Додати фото<input id="${id}" type="file" accept="image/*" multiple hidden></label><div class="photoes" id="preview-${id}" style="margin-top:7px"></div>`}function readImages(input,done){let files=[...input.files];if(files.length>8){toast('Максимум 8 фото за раз.');return}let results=[];let finish=()=>{if(results.length===files.length)done(results)};files.forEach(f=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let scale=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);results.push(c.toDataURL('image/jpeg',.76));document.getElementById('preview-'+input.id)?.insertAdjacentHTML('beforeend',`<div class="photo"><img src="${results.at(-1)}"></div>`);finish()};im.src=r.result};r.readAsDataURL(f)})}

function saveReceipt(){if(!document.getElementById('rConfirm').checked){toast('Підтверди фізичну перевірку товару.');return}let p=S.stock.find(x=>x.sku===document.getElementById('rSku').value),q=Number(document.getElementById('rQty').value)||0,c=Number(document.getElementById('rCost').value)||p.cost;if(q<1){toast('Кількість має бути більше нуля.');return}p.qty+=q;p.cost=c;let amount=q*c;S.ledger.unshift({date:'02.10.2026 '+new Date().toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'}),doc:'Прихід · GRN-'+(1000+S.ledger.length),cat:'Поставка · '+p.sku,account:'Кредиторка постачальника',debit:'Запас +'+money(amount),credit:'Кредиторка +'+money(amount),amt:amount,type:'out'});save();close();render('inventory');toast(`Прийнято ${q} од. ${p.name}.`)}
function saveExpense(){let n=Number(document.getElementById('eAmt')?.value)||0;if(n<=0){toast('Сума витрати має бути більшою за нуль.');return}acctInit();let cat=document.getElementById('eCat').value,desc=document.getElementById('eDesc').value.trim()||cat,loc=document.getElementById('eLoc').value,source=document.getElementById('eAcc').value;if(['1010','1011'].includes(source)&&source!==cashCode(loc)){toast('Обрана каса не відповідає локації витрати.');return}if(['1010','1011'].includes(source)&&!cashShiftFor(loc)){toast('Касова зміна закрита. Відкрий її перед готівковою витратою.');return}let credit=source==='cash'?(loc==='svyat'?'1011':'1010'):source,debit=cat==='Комісія банку'?'6030':'6020',doc='EXP-'+Date.now().toString().slice(-10),accountName=S.acct.accounts.find(a=>a[0]===credit)?.[1]||'Рахунок '+credit,date=new Date().toLocaleString('uk-UA',{dateStyle:'short',timeStyle:'short'});if(!acctPost(doc,`${cat} · ${desc}`,debit,credit,n,loc))return;S.ledger.unshift({date,doc:'Витрата · '+doc,cat:cat+' · '+desc,account:accountName,debit:'Витрати +'+money(n),credit:accountName+' −'+money(n),amt:n,type:'out'});let receipt={doc,category:cat,description:desc,location:locname(loc),amount:n,accountName,date};S.lastExpense=receipt;let returnPage=S.page==='finance'?'finance':'finance';save();close();render(returnPage);modal('Витрату проведено',`<div class="banner info">Внутрішню операцію записано до журналу й облікової проводки.</div><div class="twofields"><div class="detailbox"><small>ДОКУМЕНТ</small><b>${esc(receipt.doc)}</b></div><div class="detailbox"><small>СУМА</small><b class="negative">${money(receipt.amount)}</b></div><div class="detailbox"><small>КАТЕГОРІЯ / ОПИС</small><b>${esc(receipt.category)} · ${esc(receipt.description)}</b></div><div class="detailbox"><small>ЛОКАЦІЯ / РАХУНОК</small><b>${esc(receipt.location)} · ${esc(receipt.accountName)}</b></div><div class="detailbox full"><small>ДАТА</small><b>${esc(receipt.date)}</b></div></div>`,`<button class="btn" data-close>Готово · залишитися у фінансах</button>`,true)}
function savePayment(){let orderId=document.getElementById('pOrder')?.value,o=S.orders.find(x=>x.id===orderId),n=Number(document.getElementById('pAmt')?.value)||0,method=document.getElementById('pMethod')?.value||'',debit=document.getElementById('pAccount')?.value||'',reference=document.getElementById('pRef')?.value.trim()||'';if(!o){toast('Обери замовлення-наряд.');return}if(['1010','1011'].includes(debit)&&debit!==cashCode(o.loc)){toast('Готівковий платіж потрібно приймати в касу локації замовлення.');return}if(['1010','1011'].includes(debit)&&!cashShiftFor(o.loc)){toast(`Каса локації замовлення закрита. Спочатку відкрий зміну у фінансах.`);return}if(method==='Готівка'&&!['1010','1011'].includes(debit)){toast('Для готівки обери касу локації замовлення.');return}if(method==='Картка · еквайринг'&&debit!=='1020'){toast('Для картки обери рахунок еквайрингу.');return}if(method==='Переказ на рахунок'&&debit!=='1030'){toast('Для банківського переказу обери основний рахунок.');return}let balance=Math.max(0,Number(o.sum)-Number(o.paid));if(n<=0||n>balance){toast(`Сума має бути більшою за нуль і не перевищувати баланс ${money(balance)}.`);return}if(!['1010','1011','1020','1030'].includes(debit)){toast('Обери коректну касу або рахунок надходження.');return}acctInit();let accountName=S.acct.accounts.find(a=>a[0]===debit)?.[1]||'Рахунок '+debit,credit=method==='Передоплата / аванс'?'2030':'1200',doc='PAY-'+Date.now().toString().slice(-10),description=`${method} за ${o.id} · ${o.client}`,date=new Date().toLocaleString('uk-UA',{dateStyle:'short',timeStyle:'short'});if(!acctPost(doc,description,debit,credit,n,o.loc))return;let fee=method==='Картка · еквайринг'?Math.round(n*(Number(S.acct.rules.acq)||0)/100):0;if(fee>0)acctPost('FEE-'+doc,'Комісія еквайрингу за '+o.id,'6030','1020',fee,o.loc);o.paid=Number(o.paid||0)+n;if(credit==='1200'){let row=S.acct.ar.find(r=>String(r[0])===o.id);if(!row){row=[o.id,o.client,o.car,balance,new Date().toISOString().slice(0,10),'До сплати'];S.acct.ar.unshift(row)}row[3]=Math.max(0,Number(row[3]||0)-n);row[5]=row[3]===0?'Сплачено':'Частково сплачено'}S.ledger.unshift({date,doc:'Оплата · '+o.id,cat:method,account:accountName,debit:accountName+' +'+money(n),credit:(credit==='2030'?'Аванси клієнтів +':'Дебіторка −')+money(n),amt:n,type:'in',reference});let receipt={doc,orderId:o.id,client:o.client,car:o.car,amount:n,balance:Math.max(0,Number(o.sum)-Number(o.paid)),method,accountName,reference,date,fee,settlement:Math.max(0,n-fee)};S.lastPayment=receipt;let context=window.paymentContext||{page:S.page||'finance'};let returnPage=['orders','finance','customers','vehicles'].includes(context.page)?context.page:'finance';window.paymentContext=null;save();close();render(returnPage);paymentReceipt(receipt)}
function saveTransfer(){let f=document.getElementById('tFrom').value,t=document.getElementById('tTo').value,p=S.stock.find(x=>x.sku===document.getElementById('tItem').value),n=Number(document.getElementById('tQty').value)||1;if(f===t){toast('Вибери дві різні локації.');return}if(!p||p.qty-p.res<n){toast('Недостатньо доступного залишку для переміщення.');return}p.qty-=n;let copy=S.stock.find(x=>x.sku===p.sku&&x.loc===t);if(copy)copy.qty+=n;else S.stock.push({...p,qty:n,res:0,loc:t,bin:'ТРАНСФЕР'});save();close();render('transfers');toast('Демо-трансфер проведено. У робочій системі він пройде етап «у дорозі».')}

function maybeWorkshopQuip(){let day=new Date().toLocaleDateString('sv-SE');if(!S.quipState||S.quipState.day!==day)S.quipState={day,count:0,max:Math.random()<.32?2:1,lastAt:0,seen:[]};let q=S.quipState,now=Date.now();if(q.count>=q.max||q.count>0&&now-q.lastAt<5*60*60*1000)return;let lines=['Гайковий ключ сьогодні на місці. Занотовуємо як позитивну динаміку.','Авто сказало «там дрібниця». Наряд чемно попросив уточнити.','Якщо після ремонту зник звук — перевір, чи це не радіо вимкнулося.','На складі є все. Крім тієї деталі, за якою щойно прийшли.','Підйомник працює тихо. Не наврочимо йому зміну.','Діагностика завершена: причина шуму знайдена. Тепер знайти, звідки він був.','Клієнт сказав «робіть як собі». Майстер уже шукає калькулятор.','Сьогодні всі болти відкрутилися з першого разу. Демоверсія дня.','Найкоротший ремонт — той, де скарга була «передумав».'];let options=lines.map((_,i)=>i).filter(i=>!q.seen.includes(i));if(!options.length)q.seen=[];let idx=options[Math.floor(Math.random()*options.length)];q.seen.push(idx);q.count++;q.lastAt=now;save();toast(lines[idx],5600,'quip')}
